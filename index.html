.budget-item{margin-bottom:19px}.budget-top{display:flex;justify-content:space-between;gap:10px}.budget-name{font-weight:750}.budget-meta{font-size:12px;color:var(--muted);margin-top:3px}.budget-item .progress{height:10px}.kpi-line{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.kpi-line:last-child{border-bottom:0}.kpi-line b{font-weight:800}.empty{padding:35px 10px;text-align:center;color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:rgba(14,16,23,.48);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal-backdrop.show{display:flex}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.2);padding:21px}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:13px}.modal-head h2{font-size:19px;margin:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.form-group{margin-bottom:12px}.form-group.full{grid-column:1/-1}.form-group label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none}.form-group textarea{min-height:80px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:5px}

.toast{position:fixed;right:18px;bottom:18px;padding:12px 15px;border-radius:12px;background:#20222c;color:#fff;box-shadow:0 15px 30px rgba(0,0,0,.25);z-index:200;opacity:0;transform:translateY(8px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateY(0)}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.setting{display:flex;align-items:center;justify-content:space-between;gap:15px}.switch{position:relative;width:46px;height:26px}.switch input{display:none}.slider{position:absolute;inset:0;border-radius:99px;background:#b9bdc9;cursor:pointer;transition:.2s}.slider:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:var(--accent)}.switch input:checked+.slider:before{transform:translateX(20px)}
@media(max-width:1050px){.sidebar{width:78px}.brand{justify-content:center;padding-left:0;padding-right:0}.brand-name,.sidebar-footer{display:none}.nav-btn{justify-content:center}.nav-label{display:none}.main{margin-left:78px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-2,.grid-3{grid-template-columns:1fr 1fr}.grid-2> :first-child{grid-column:1/-1}}
@media(max-width:720px){.paycheck-summary{grid-template-columns:1fr 1fr}.paycheck-week-label{min-width:145px}.sidebar{display:none}.main{margin-left:0;padding:18px 14px 95px}.mobile-nav{display:grid;grid-template-columns:repeat(9,minmax(72px,1fr));overflow-x:auto}.topbar{align-items:flex-start}.topbar h1{font-size:24px}.top-actions .secondary-top{display:none}.cards{grid-template-columns:1fr 1fr}.grid-2,.grid-3,.settings-grid{grid-template-columns:1fr}.grid-2> :first-child{grid-column:auto}.search{min-width:170px;flex:1}.toolbar .field{flex:1}.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}.table{min-width:650px}}
@media(max-width:430px){.cards{gap:9px}.card{padding:15px}.stat .value{font-size:21px}.topbar{margin-bottom:18px}.topbar p{font-size:12px}.btn.primary{padding:9px 11px}.top-actions{gap:5px}}

<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">✦</div><div class="brand-name">Fin<span>Pilot</span></div></div>
  <nav class="nav" id="desktopNav"></nav>
  <div class="sidebar-footer"><div class="profile"><div class="avatar">FP</div><div><b>My finances</b><small>Local profile</small></div></div></div>
</aside>
<main class="main">
  <div id="page-dashboard" class="page"></div>
  <div id="page-paychecks" class="page"></div>
  <div id="page-transactions" class="page"></div>
  <div id="page-accounts" class="page"></div>
  <div id="page-budget" class="page"></div>
  <div id="page-goals" class="page"></div>
  <div id="page-bills" class="page"></div>
  <div id="page-networth" class="page"></div>
  <div id="page-settings" class="page"></div>
</main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,text/csv,.json,.csv" hidden>
<script>
const NAV=[
 {id:'dashboard',label:'Dashboard',icon:'🏠'},
 {id:'paychecks',label:'Paychecks',icon:'💵'},
 {id:'transactions',label:'Transactions',icon:'💸'},
 {id:'accounts',label:'Accounts',icon:'🏦'},
 {id:'budget',label:'Budget',icon:'📊'},
 {id:'goals',label:'Goals',icon:'🎯'},
 {id:'bills',label:'Bills',icon:'🔄'},
 {id:'networth',label:'Net Worth',icon:'📈'},
 {id:'settings',label:'Settings',icon:'⚙️'}
];
const DEFAULT_STATE={
 theme:'light',currency:'USD',currentPage:'dashboard',periodMode:'week',periodAnchor:new Date().toISOString().slice(0,10),checkWeekAnchor:new Date().toISOString().slice(0,10),
 accounts:[],
 transactions:[],
 budgets:[],
 goals:[],
 paychecks:[],
 bills:[]
};
let state=loadState();
let activeFilters={query:'',category:'All'};
const $=sel=>document.querySelector(sel);
function clone(o){return JSON.parse(JSON.stringify(o))}
function loadState(){try{const raw=localStorage.getItem('finpilot-v47');const loaded=raw?{...clone(DEFAULT_STATE),...JSON.parse(raw)}:clone(DEFAULT_STATE);loaded.paychecks=(loaded.paychecks||[]).map(p=>({...p, billIds:p.billIds||[], allocations:p.allocations||[]}));loaded.bills=(loaded.bills||[]).map(b=>({...b,frequency:b.frequency||'month',startDate:b.startDate||dateKey(new Date())}));loaded.goals=loaded.goals||[];return loaded}catch{return clone(DEFAULT_STATE)}}
function save(){localStorage.setItem('finpilot-v47',JSON.stringify(state));applyTheme();}
function fmt(n){const sign=n<0?'-$':'$';return sign+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtSigned(n){return n>0?'+'+fmt(n):fmt(n)}
function dateLabel(date){const d=new Date(date+'T12:00:00'); const today=new Date(); const y=d.getFullYear(),m=d.getMonth(),day=d.getDate(); if(y===today.getFullYear()&&m===today.getMonth()&&day===today.getDate()) return 'Today'; const yest=new Date(today); yest.setDate(today.getDate()-1); if(y===yest.getFullYear()&&m===yest.getMonth()&&day===yest.getDate()) return 'Yesterday'; return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:y!==today.getFullYear()?'numeric':undefined})}
function monthKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function weekStart(d){const x=new Date(d);x.setHours(12,0,0,0);const day=x.getDay();const diff=(day+6)%7;x.setDate(x.getDate()-diff);return x}
function dateKey(d){return new Date(d).toISOString().slice(0,10)}
function periodRange(){const anchor=new Date((state.periodAnchor||dateKey(new Date()))+'T12:00:00');if(state.periodMode==='month'){const start=new Date(anchor.getFullYear(),anchor.getMonth(),1,12);const end=new Date(anchor.getFullYear(),anchor.getMonth()+1,0,12);return {start,end}}const start=weekStart(anchor);const end=new Date(start);end.setDate(start.getDate()+(state.periodMode==='biweek'?13:6));return {start,end}}
function periodLabel(){const r=periodRange();if(state.periodMode==='month')return r.start.toLocaleDateString(undefined,{month:'long',year:'numeric'});return `${r.start.toLocaleDateString(undefined,{month:'short',day:'numeric'})} – ${r.end.toLocaleDateString(undefined,{month:'short',day:'numeric',year:r.end.getFullYear()!==new Date().getFullYear()?'numeric':undefined})}`}
function inPeriod(date){const d=new Date(date+'T12:00:00'),r=periodRange();return d>=r.start&&d<=r.end}
function periodTx(){return state.transactions.filter(t=>inPeriod(t.date))}
function periodIncome(){return periodTx().filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0)}
function periodSpend(){return periodTx().filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0)}
function periodSpendByCategory(category){return periodTx().filter(t=>t.amount<0&&t.category===category).reduce((s,t)=>s+Math.abs(t.amount),0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function categoryIcon(c){return ({Housing:'🏠',Food:'🍔',Transportation:'🚗',Shopping:'🛒',Fun:'🎮',Entertainment:'🎬',Travel:'✈️',Income:'💰',Utilities:'💡',Health:'❤️',Other:'💸'})[c]||'💸'}
function accountName(id){return state.accounts.find(a=>a.id===Number(id))?.name||'Account'}
function isAsset(a){return !['Credit Card','Loan'].includes(a.type)}
function totals(){const assets=state.accounts.filter(isAsset).reduce((s,a)=>s+a.balance,0),liabilities=state.accounts.filter(a=>!isAsset(a)).reduce((s,a)=>s+Math.abs(Math.min(0,a.balance)),0);return {assets,liabilities,net:assets-liabilities}}
function monthTx(){return periodTx()}
function spendByCategory(category){return periodSpendByCategory(category)}
function monthlyIncome(){return periodIncome()}
function monthlySpend(){return periodSpend()}
function billNextDueDate(b,fromDate=new Date()){const base=new Date(fromDate);base.setHours(12,0,0,0);const freq=b.frequency||'month';if(freq==='month'){let y=base.getFullYear(),m=base.getMonth(),day=Math.min(Number(b.dueDay)||1,new Date(y,m+1,0).getDate());let d=new Date(y,m,day,12);if(d<base){m++;d=new Date(y,m,Math.min(Number(b.dueDay)||1,new Date(y,m+1,0).getDate()),12)}return d}let start=new Date((b.startDate||dateKey(base))+'T12:00:00');if(start>base)return start;const step=freq==='biweek'?14:7;const diff=Math.max(0,Math.floor((base-start)/86400000));const jumps=Math.ceil(diff/step);const d=new Date(start);d.setDate(start.getDate()+jumps*step);return d}
function billDueInRange(b,start,end){let d=billNextDueDate(b,start);return d<=end}
function billFrequencyLabel(b){return b.frequency==='biweek'?'Every 2 weeks':b.frequency==='week'?'Every week':'Monthly'}
function upcomingBills(){const now=new Date();now.setHours(12,0,0,0);return state.bills.map(b=>({...b,nextDue:billNextDueDate(b,now)})).filter(b=>b.nextDue>=now&&b.nextDue<=new Date(now.getTime()+14*86400000)).sort((a,b)=>a.nextDue-b.nextDue)}
function applyTheme(){document.documentElement.dataset.theme=state.theme; if($('#themeToggle')) $('#themeToggle').checked=state.theme==='dark'}
function navHTML(){return NAV.map(n=>`<button class="nav-btn ${state.currentPage===n.id?'active':''}" data-page="${n.id}"><span class="nav-icon">${n.icon}</span><span class="nav-label">${n.label}</span></button>`).join('')}
function bindNav(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(page){state.currentPage=page;save();render()}
function topbar(title,sub,actions='',showPeriod=false){const control=showPeriod?`<div class="period-control"><button class="btn icon" onclick="shiftPeriod(-1)" aria-label="Previous period">‹</button><select class="field period-mode" id="periodMode" onchange="setPeriodMode(this.value)"><option value="week" ${state.periodMode==='week'?'selected':''}>Week</option><option value="biweek" ${state.periodMode==='biweek'?'selected':''}>Bi-week</option><option value="month" ${state.periodMode==='month'?'selected':''}>Month</option></select><button class="btn period-label" onclick="goCurrentPeriod()">${esc(periodLabel())}</button><button class="btn icon" onclick="shiftPeriod(1)" aria-label="Next period">›</button></div>`:'';return `<div class="topbar"><div><h1>${title}</h1><p>${sub}</p></div><div class="top-actions">${control}${actions}</div></div>`}
function setPeriodMode(mode){state.periodMode=mode;state.periodAnchor=dateKey(new Date());save();render()}
function shiftPeriod(dir){const d=new Date((state.periodAnchor||dateKey(new Date()))+'T12:00:00');if(state.periodMode==='month')d.setMonth(d.getMonth()+dir);else d.setDate(d.getDate()+(state.periodMode==='biweek'?14:7)*dir);state.periodAnchor=dateKey(d);save();render()}
function goCurrentPeriod(){state.periodAnchor=dateKey(new Date());save();render()}
function stat(label,value,sub,cls=''){return `<div class="card stat"><div class="label">${label}</div><div class="value">${value}</div><div class="sub ${cls}">${sub}</div></div>`}
function render(){
  $('#desktopNav').innerHTML=navHTML();$('#mobileNav').innerHTML=navHTML();bindNav();
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(`#page-${state.currentPage}`).classList.add('active');
  renderDashboard();renderPaychecks();renderTransactions();renderAccounts();renderBudget();renderGoals();renderBills();renderNetworth();renderSettings();
  applyTheme();

function drawCashFlow(){const c=$('#cashFlowChart');if(!c)return;fitCanvas(c);const ctx=c.getContext('2d');const rect=c.getBoundingClientRect();const w=rect.width,h=rect.height;ctx.clearRect(0,0,w,h);const r=periodRange(),days=Math.max(1,Math.round((r.end-r.start)/86400000)+1),income=Array(days).fill(0),spend=Array(days).fill(0);state.transactions.filter(t=>inPeriod(t.date)).forEach(t=>{const d=Math.round((new Date(t.date+'T12:00:00')-r.start)/86400000);if(d>=0&&d<days)(t.amount>0?income:spend)[d]+=Math.abs(t.amount)});const max=Math.max(100,...income,...spend);chartBars(ctx,w,h,[income,spend],max);}
function drawNetworth(){const c=$('#nwChart');if(!c)return;fitCanvas(c);const ctx=c.getContext('2d');const rect=c.getBoundingClientRect();const w=rect.width,h=rect.height;ctx.clearRect(0,0,w,h);const current=totals().net;const pts=[current*.78,current*.83,current*.88,current*.91,current*.96,current];lineChart(ctx,w,h,pts);}
function fitCanvas(c){const dpr=window.devicePixelRatio||1,r=c.getBoundingClientRect();c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);c.getContext('2d').scale(dpr,dpr)}
function chartBars(ctx,w,h,sets,max){const pad=24,base=h-24,group=w-40;const step=group/sets[0].length;ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--line');ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad,base);ctx.lineTo(w-pad,base);ctx.stroke();sets.forEach((arr,si)=>{arr.forEach((v,i)=>{if(!v)return;const bh=(v/max)*(h-50),x=pad+i*step+(si?step*.52:step*.10),bw=step*.32;ctx.fillStyle=si===0?'#635bff':'#d94b5c';ctx.beginPath();ctx.roundRect(x,base-bh,bw,bh,5);ctx.fill()})});}
function lineChart(ctx,w,h,pts){const pad=25,max=Math.max(...pts),min=Math.min(...pts),range=max-min||1;ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--line');ctx.beginPath();for(let i=0;i<4;i++){const y=pad+i*(h-2*pad)/3;ctx.moveTo(pad,y);ctx.lineTo(w-pad,y)}ctx.stroke();ctx.strokeStyle='#635bff';ctx.lineWidth=3;ctx.beginPath();pts.forEach((p,i)=>{const x=pad+i*(w-2*pad)/(pts.length-1),y=pad+(max-p)/range*(h-2*pad);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();pts.forEach((p,i)=>{const x=pad+i*(w-2*pad)/(pts.length-1),y=pad+(max-p)/range*(h-2*pad);ctx.fillStyle='#635bff';ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill()})}

function openBillModal(id){const editing=state.bills.find(b=>b.id===id);const b=editing||{name:'',amount:0,dueDay:1,category:'Utilities',accountId:state.accounts[0]?.id||'',frequency:'month',startDate:dateKey(new Date())};showModal(`<div class="modal-head"><h2>${editing?'Edit':'Add'} recurring bill</h2><button class="btn icon" onclick="closeModal()">✕</button></div><form id="billForm"><div class="form-grid"><div class="form-group"><label>Name</label><input id="rName" required value="${esc(b.name)}" placeholder="Save $500"></div><div class="form-group"><label>Amount each occurrence</label><input id="rAmount" type="number" step="0.01" min="0" required value="${b.amount}"></div><div class="form-group"><label>Frequency</label><select id="rFreq"><option value="month" ${b.frequency==='month'?'selected':''}>Monthly</option><option value="week" ${b.frequency==='week'?'selected':''}>Every week</option><option value="biweek" ${b.frequency==='biweek'?'selected':''}>Every 2 weeks</option></select></div><div class="form-group" id="dueDayGroup"><label>Due day of month</label><input id="rDay" type="number" min="1" max="31" value="${b.dueDay||1}"></div><div class="form-group" id="startDateGroup"><label>First / next due date</label><input id="rStart" type="date" value="${b.startDate||dateKey(new Date())}"></div><div class="form-group"><label>Category</label><select id="rCat">${categoryOptions(b.category)}</select></div><div class="form-group full"><label>Account</label><select id="rAccount"><option value="">No account</option>${state.accounts.map(a=>`<option value="${a.id}" ${a.id===Number(b.accountId)?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div></div><p class="muted small">For example, set <b>$500</b> and <b>Every 2 weeks</b> to create a recurring $500 obligation you can assign to the appropriate paycheck.</p><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`);const syncBillFields=()=>{$('#dueDayGroup').style.display=$('#rFreq').value==='month'?'block':'none';$('#startDateGroup').style.display=$('#rFreq').value==='month'?'none':'block'};$('#rFreq').onchange=syncBillFields;syncBillFields();$('#billForm').onsubmit=e=>{e.preventDefault();const freq=$('#rFreq').value;const payload={name:$('#rName').value.trim(),amount:Number($('#rAmount').value),dueDay:Math.max(1,Math.min(31,Number($('#rDay').value)||1)),frequency:freq,startDate:$('#rStart').value||dateKey(new Date()),category:$('#rCat').value,accountId:$('#rAccount').value?Number($('#rAccount').value):null,recurring:true};if(!payload.name||!Number.isFinite(payload.amount)||payload.amount<0)return;if(editing)Object.assign(editing,payload);else state.bills.push({id:Date.now(),...payload});save();closeModal();toast(editing?'Bill updated':'Bill added');render()}}

function showModal(html){$('#modal').innerHTML=html;$('#modalBackdrop').classList.add('show')}
function closeModal(){$('#modalBackdrop').classList.remove('show');$('#modal').innerHTML=''}
$('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function deleteTx(id){const t=state.transactions.find(x=>x.id===id);if(!t||!confirm(`Delete ${t.merchant}?`))return;state.transactions=state.transactions.filter(x=>x.id!==id);save();toast('Transaction removed');render()}
function deleteAccount(id){if(!confirm('Delete this account? Existing transactions will remain and show as Account.'))return;state.accounts=state.accounts.filter(a=>a.id!==id);state.transactions.forEach(t=>{if(t.accountId===id)t.accountId=null});save();toast('Account deleted');render()}
function deletePaycheck(id){const p=state.paychecks.find(x=>Number(x.id)===Number(id));if(!p||!confirm('Delete this paycheck? Linked spending transactions will remain but will no longer count against a paycheck.'))return;applyPaycheckDeposit(p,-1);(p.allocations||[]).forEach(reverseAllocation);state.paychecks=state.paychecks.filter(x=>Number(x.id)!==Number(id));state.transactions.forEach(t=>{if(Number(t.paycheckId)===Number(id))t.paycheckId=null});save();toast('Paycheck deleted');render()}
function deleteBudget(id){if(confirm('Delete this budget category?')){state.budgets=state.budgets.filter(b=>b.id!==id);save();toast('Budget category deleted');render()}}
function deleteGoal(id){if(confirm('Delete this goal?')){state.goals=state.goals.filter(g=>g.id!==id);save();toast('Goal deleted');render()}}
function deleteBill(id){if(confirm('Delete this bill?')){state.bills=state.bills.filter(b=>b.id!==id);save();toast('Bill deleted');render()}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800)}
function exportCSV(){const rows=[['Date','Merchant','Category','Account','Amount','Note'],...state.transactions.map(t=>[t.date,t.merchant,t.category,accountName(t.accountId),t.amount,t.note||''])];downloadText('finpilot-transactions.csv',rows.map(r=>r.map(csvEscape).join(',')).join('\n'),'text/csv');toast('CSV exported')}
function csvEscape(v){const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function backupJSON(){const payload={app:'FinPilot',version:6,exportedAt:new Date().toISOString(),data:state};downloadText('finpilot-phone-backup.json',JSON.stringify(payload,null,2),'application/json');toast('Full phone backup exported')}
function importJSONPayload(parsed){const incoming=parsed?.data&&parsed.app==='FinPilot'?parsed.data:parsed;if(!incoming||!Array.isArray(incoming.accounts)||!Array.isArray(incoming.transactions))throw new Error('Invalid FinPilot backup');state={...clone(DEFAULT_STATE),...incoming,currentPage:state.currentPage};state.paychecks=(state.paychecks||[]).map(p=>({...p,allocations:p.allocations||[],billIds:p.billIds||[]}));state.transactions=(state.transactions||[]).map(t=>({...t,purpose:t.purpose||t.note||t.category}));state.bills=(state.bills||[]).map(b=>({...b,frequency:b.frequency||'month',startDate:b.startDate||dateKey(new Date())}));save()}
function downloadText(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
$('#importFile').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const raw=String(reader.result||'');if(/\.csv$/i.test(file.name)){const lines=raw.split(/\r?\n/).filter(Boolean);const rows=lines.slice(1).map(parseCSVLine);if(!rows.length)throw new Error('Empty CSV');rows.forEach(r=>{const [date,merchant,category,account,amount,note]=r;const acct=state.accounts.find(a=>(a.name||'').toLowerCase()===(account||'').toLowerCase())||state.accounts[0];state.transactions.push({id:Date.now()+Math.random(),date:date||new Date().toISOString().slice(0,10),merchant:merchant||'Imported',category:category||'Other',accountId:acct?.id||null,amount:Number(String(amount||0).replace(/[$,]/g,''))||0,note:note||''})});save();toast(`${rows.length} transactions imported`);render();return}const parsed=JSON.parse(raw);importJSONPayload(parsed);toast('Full backup imported');render()}catch(err){alert('Could not import that file. Use a FinPilot JSON backup or a CSV exported from FinPilot.')}e.target.value=''};reader.readAsText(file)})
function parseCSVLine(line){const out=[];let cur='',quoted=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(quoted&&line[i+1]==='"'){cur+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out}
function resetData(){if(!confirm('Reset FinPilot to a completely blank account? This will permanently remove all accounts, transactions, budgets, goals, and bills stored on this device.'))return;state=clone(DEFAULT_STATE);save();toast('FinPilot reset to blank');render()}
window.addEventListener('resize',()=>{if(state.currentPage==='dashboard')drawCashFlow();if(state.currentPage==='networth')drawNetworth()});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
render();

function paycheckAvailable(paycheckId){
  const p=state.paychecks.find(x=>Number(x.id)===Number(paycheckId));
  if(!p) return 0;
  const bills=(p.billIds||[]).map(Number).map(id=>state.bills.find(b=>Number(b.id)===id)).filter(Boolean)
    .reduce((a,b)=>a+Number(b.amount||0),0);
  const alloc=(p.allocations||[]).reduce((a,x)=>a+Number(x.amount||0),0);
  const txs=state.transactions.filter(t=>Number(t.paycheckId)===Number(paycheckId));
  const spent=txs.filter(t=>Number(t.amount)<0).reduce((a,t)=>a+Math.abs(Number(t.amount)),0);
  const extra=txs.filter(t=>Number(t.amount)>0).reduce((a,t)=>a+Number(t.amount),0);
  return Number(p.amount||0)-bills-alloc-spent+extra;
}
