<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}body{overflow-x:hidden}
button,input,select{font:inherit}button{border:0;cursor:pointer;color:inherit}a{color:inherit}.app{min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--card);border-right:1px solid var(--line);padding:22px 15px;z-index:20}.brand{display:flex;align-items:center;gap:10px;padding:7px 12px 25px;font-size:22px;font-weight:850;letter-spacing:-.4px}.brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#8b84ff);color:#fff;display:grid;place-items:center;font-size:17px;box-shadow:0 7px 16px rgba(99,91,255,.25)}.brand span{color:var(--accent)}.nav{display:grid;gap:5px}.nav-btn{width:100%;background:transparent;border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:11px;color:var(--muted);text-align:left;font-weight:650}.nav-btn:hover,.nav-btn.active{background:var(--accent-soft);color:var(--accent)}.nav-icon{width:21px;text-align:center}.sidebar-footer{position:absolute;left:15px;right:15px;bottom:18px}.sidebar-footer .profile{padding:12px;border:1px solid var(--line);border-radius:14px;display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800}.profile small{display:block;color:var(--muted)}
.main{margin-left:248px;padding:28px 34px 95px;max-width:1600px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px}.topbar h1{margin:0;font-size:29px;line-height:1.1;letter-spacing:-.8px}.topbar p{margin:6px 0 0;color:var(--muted)}.top-actions{display:flex;gap:9px;align-items:center}.period-control{display:flex;align-items:center;gap:5px}.period-mode{width:92px}.period-label{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.btn{padding:10px 14px;border-radius:11px;font-weight:750;border:1px solid var(--line);background:var(--card)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 7px 16px rgba(99,91,255,.2)}.btn.ghost{background:transparent}.btn.danger{color:var(--red);background:var(--red-soft);border-color:transparent}.btn.icon{width:40px;height:40px;padding:0;display:grid;place-items:center}.page{display:none}.page.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:19px}.stat .label{font-size:12px;letter-spacing:.7px;color:var(--muted);font-weight:750}.stat .value{font-size:28px;font-weight:850;margin:8px 0 3px;letter-spacing:-.7px}.stat .sub{font-size:13px;color:var(--muted)}.up{color:var(--green)!important}.down{color:var(--red)!important}.warn{color:var(--amber)!important}
.grid-2{display:grid;grid-template-columns:1.35fr .9fr;gap:16px;margin-top:16px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}.section-title{font-size:17px;margin:0 0 16px}.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.left{display:flex;align-items:center;gap:11px;min-width:0}.row .left>div:last-child{min-width:0}.merchant{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subtext{margin-top:3px;color:var(--muted);font-size:12px}.amount{font-weight:800;white-space:nowrap}.amount.expense{color:var(--red)}.amount.income{color:var(--green)}.amount.transfer{color:var(--muted)}.icon-box{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;flex:0 0 auto}.progress{height:9px;background:color-mix(in srgb,var(--line) 80%, transparent);border-radius:999px;overflow:hidden;margin-top:10px}.progress>span{height:100%;display:block;background:var(--accent);border-radius:inherit}.progress.danger>span{background:var(--red)}.progress.safe>span{background:var(--green)}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.field, .search{background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:none}.field:focus,.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}.search{min-width:220px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:13px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--muted);font-size:11px;letter-spacing:.6px;text-transform:uppercase}.table .right{text-align:right}.table tr:hover td{background:color-mix(in srgb,var(--accent-soft) 30%,transparent)}.actions-cell{display:flex;gap:6px;justify-content:flex-end}.icon-btn{width:33px;height:33px;border-radius:9px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center}.icon-btn:hover{background:var(--accent-soft);color:var(--accent)}
.account-card{display:flex;flex-direction:column;gap:9px;min-height:145px}.account-head{display:flex;justify-content:space-between;gap:8px}.account-name{font-weight:800}.account-balance{font-size:24px;font-weight:850;margin-top:auto}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:var(--bg);color:var(--muted);font-size:11px;font-weight:750}.badge.green{background:var(--green-soft);color:var(--green)}.badge.red{background:var(--red-soft);color:var(--red)}.badge.amber{background:var(--amber-soft);color:var(--amber)}
.budget-item{margin-bottom:19px}.budget-top{display:flex;justify-content:space-between;gap:10px}.budget-name{font-weight:750}.budget-meta{font-size:12px;color:var(--muted);margin-top:3px}.budget-item .progress{height:10px}.kpi-line{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.kpi-line:last-child{border-bottom:0}.kpi-line b{font-weight:800}.empty{padding:35px 10px;text-align:center;color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:rgba(14,16,23,.48);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal-backdrop.show{display:flex}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.2);padding:21px}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:13px}.modal-head h2{font-size:19px;margin:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.form-group{margin-bottom:12px}.form-group.full{grid-column:1/-1}.form-group label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none}.form-group textarea{min-height:80px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:5px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:15px;overflow:auto}.tab{padding:10px 11px;color:var(--muted);background:none;font-weight:750;border-bottom:2px solid transparent;white-space:nowrap}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}.chart-wrap{height:270px;position:relative}.chart-wrap canvas{width:100%;height:100%;display:block}.chart-legend{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--accent)}
.mobile-nav{display:none;position:fixed;left:10px;right:10px;bottom:9px;background:color-mix(in srgb,var(--card) 94%,transparent);border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.15);backdrop-filter:blur(12px);border-radius:18px;padding:7px;z-index:50}.mobile-nav .nav-btn{justify-content:center;flex-direction:column;gap:2px;font-size:10px;padding:7px 3px}.mobile-nav .nav-icon{font-size:18px}
.toast{position:fixed;right:18px;bottom:18px;padding:12px 15px;border-radius:12px;background:#20222c;color:#fff;box-shadow:0 15px 30px rgba(0,0,0,.25);z-index:200;opacity:0;transform:translateY(8px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateY(0)}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.setting{display:flex;align-items:center;justify-content:space-between;gap:15px}.switch{position:relative;width:46px;height:26px}.switch input{display:none}.slider{position:absolute;inset:0;border-radius:99px;background:#b9bdc9;cursor:pointer;transition:.2s}.slider:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:var(--accent)}.switch input:checked+.slider:before{transform:translateX(20px)}
@media(max-width:1050px){.sidebar{width:78px}.brand{justify-content:center;padding-left:0;padding-right:0}.brand-name,.sidebar-footer{display:none}.nav-btn{justify-content:center}.nav-label{display:none}.main{margin-left:78px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-2,.grid-3{grid-template-columns:1fr 1fr}.grid-2> :first-child{grid-column:1/-1}}
@media(max-width:720px){.sidebar{display:none}.main{margin-left:0;padding:18px 14px 95px}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr)}.topbar{align-items:flex-start}.topbar h1{font-size:24px}.top-actions .secondary-top{display:none}.cards{grid-template-columns:1fr 1fr}.grid-2,.grid-3,.settings-grid{grid-template-columns:1fr}.grid-2> :first-child{grid-column:auto}.search{min-width:170px;flex:1}.toolbar .field{flex:1}.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}.table{min-width:650px}}
@media(max-width:430px){.cards{gap:9px}.card{padding:15px}.stat .value{font-size:21px}.topbar{margin-bottom:18px}.topbar p{font-size:12px}.btn.primary{padding:9px 11px}.top-actions{gap:5px}}
</style>

<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">✦</div><div class="brand-name">Fin<span>Pilot</span></div></div>
  <nav class="nav" id="desktopNav"></nav>
  <div class="sidebar-footer"><div class="profile"><div class="avatar">FP</div><div><b>My finances</b><small>Local profile</small></div></div></div>
</aside>
<main class="main">
  <div id="page-dashboard" class="page"></div>
  <div id="page-transactions" class="page"></div>
  <div id="page-accounts" class="page"></div>
  <div id="page-budget" class="page"></div>
  <div id="page-goals" class="page"></div>
  <div id="page-bills" class="page"></div>
  <div id="page-networth" class="page"></div>
  <div id="page-settings" class="page"></div>
</main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,text/csv,.json,.csv" hidden>
<script>
const NAV=[
 {id:'dashboard',label:'Dashboard',icon:'🏠'},
 {id:'transactions',label:'Transactions',icon:'💸'},
 {id:'accounts',label:'Accounts',icon:'🏦'},
 {id:'budget',label:'Budget',icon:'📊'},
 {id:'goals',label:'Goals',icon:'🎯'},
 {id:'bills',label:'Bills',icon:'🔄'},
 {id:'networth',label:'Net Worth',icon:'📈'},
 {id:'settings',label:'Settings',icon:'⚙️'}
];
const DEFAULT_STATE={
 theme:'light',currency:'USD',currentPage:'dashboard',periodMode:'week',periodAnchor:new Date().toISOString().slice(0,10),
 accounts:[],
 transactions:[],
 budgets:[],
 goals:[],
 bills:[]
};
let state=loadState();
let activeFilters={query:'',category:'All'};
const $=sel=>document.querySelector(sel);
function clone(o){return JSON.parse(JSON.stringify(o))}
function loadState(){try{const raw=localStorage.getItem('finpilot-v4');return raw?{...clone(DEFAULT_STATE),...JSON.parse(raw)}:clone(DEFAULT_STATE)}catch{return clone(DEFAULT_STATE)}}
function save(){localStorage.setItem('finpilot-v4',JSON.stringify(state));applyTheme();}
function fmt(n){const sign=n<0?'-$':'$';return sign+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtSigned(n){return n>0?'+'+fmt(n):fmt(n)}
function dateLabel(date){const d=new Date(date+'T12:00:00'); const today=new Date(); const y=d.getFullYear(),m=d.getMonth(),day=d.getDate(); if(y===today.getFullYear()&&m===today.getMonth()&&day===today.getDate()) return 'Today'; const yest=new Date(today); yest.setDate(today.getDate()-1); if(y===yest.getFullYear()&&m===yest.getMonth()&&day===yest.getDate()) return 'Yesterday'; return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:y!==today.getFullYear()?'numeric':undefined})}
function monthKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function weekStart(d){const x=new Date(d);x.setHours(12,0,0,0);const day=x.getDay();const diff=(day+6)%7;x.setDate(x.getDate()-diff);return x}
function dateKey(d){return new Date(d).toISOString().slice(0,10)}
function periodRange(){const anchor=new Date((state.periodAnchor||dateKey(new Date()))+'T12:00:00');if(state.periodMode==='month'){const start=new Date(anchor.getFullYear(),anchor.getMonth(),1,12);const end=new Date(anchor.getFullYear(),anchor.getMonth()+1,0,12);return {start,end}}const start=weekStart(anchor);const end=new Date(start);end.setDate(start.getDate()+(state.periodMode==='biweek'?13:6));return {start,end}}
function periodLabel(){const r=periodRange();if(state.periodMode==='month')return r.start.toLocaleDateString(undefined,{month:'long',year:'numeric'});return `${r.start.toLocaleDateString(undefined,{month:'short',day:'numeric'})} – ${r.end.toLocaleDateString(undefined,{month:'short',day:'numeric',year:r.end.getFullYear()!==new Date().getFullYear()?'numeric':undefined})}`}
function inPeriod(date){const d=new Date(date+'T12:00:00'),r=periodRange();return d>=r.start&&d<=r.end}
function periodTx(){return state.transactions.filter(t=>inPeriod(t.date))}
function periodIncome(){return periodTx().filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0)}
function periodSpend(){return periodTx().filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0)}
function periodSpendByCategory(category){return periodTx().filter(t=>t.amount<0&&t.category===category).reduce((s,t)=>s+Math.abs(t.amount),0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function categoryIcon(c){return ({Housing:'🏠',Food:'🍔',Transportation:'🚗',Shopping:'🛒',Fun:'🎮',Entertainment:'🎬',Travel:'✈️',Income:'💰',Utilities:'💡',Health:'❤️',Other:'💸'})[c]||'💸'}
function accountName(id){return state.accounts.find(a=>a.id===Number(id))?.name||'Account'}
function isAsset(a){return !['Credit Card','Loan'].includes(a.type)}
function totals(){const assets=state.accounts.filter(isAsset).reduce((s,a)=>s+a.balance,0),liabilities=state.accounts.filter(a=>!isAsset(a)).reduce((s,a)=>s+Math.abs(Math.min(0,a.balance)),0);return {assets,liabilities,net:assets-liabilities}}
function monthTx(){return periodTx()}
function spendByCategory(category){return periodSpendByCategory(category)}
function monthlyIncome(){return periodIncome()}
function monthlySpend(){return periodSpend()}
function upcomingBills(){const day=new Date().getDate();return state.bills.filter(b=>b.dueDay>=day).sort((a,b)=>a.dueDay-b.dueDay)}
function applyTheme(){document.documentElement.dataset.theme=state.theme; if($('#themeToggle')) $('#themeToggle').checked=state.theme==='dark'}
function navHTML(){return NAV.map(n=>`<button class="nav-btn ${state.currentPage===n.id?'active':''}" data-page="${n.id}"><span class="nav-icon">${n.icon}</span><span class="nav-label">${n.label}</span></button>`).join('')}
function bindNav(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(page){state.currentPage=page;save();render()}
function topbar(title,sub,actions='',showPeriod=false){const control=showPeriod?`<div class="period-control"><button class="btn icon" onclick="shiftPeriod(-1)" aria-label="Previous period">‹</button><select class="field period-mode" id="periodMode" onchange="setPeriodMode(this.value)"><option value="week" ${state.periodMode==='week'?'selected':''}>Week</option><option value="biweek" ${state.periodMode==='biweek'?'selected':''}>Bi-week</option><option value="month" ${state.periodMode==='month'?'selected':''}>Month</option></select><button class="btn period-label" onclick="goCurrentPeriod()">${esc(periodLabel())}</button><button class="btn icon" onclick="shiftPeriod(1)" aria-label="Next period">›</button></div>`:'';return `<div class="topbar"><div><h1>${title}</h1><p>${sub}</p></div><div class="top-actions">${control}${actions}</div></div>`}
function setPeriodMode(mode){state.periodMode=mode;state.periodAnchor=dateKey(new Date());save();render()}
function shiftPeriod(dir){const d=new Date((state.periodAnchor||dateKey(new Date()))+'T12:00:00');if(state.periodMode==='month')d.setMonth(d.getMonth()+dir);else d.setDate(d.getDate()+(state.periodMode==='biweek'?14:7)*dir);state.periodAnchor=dateKey(d);save();render()}
function goCurrentPeriod(){state.periodAnchor=dateKey(new Date());save();render()}
function stat(label,value,sub,cls=''){return `<div class="card stat"><div class="label">${label}</div><div class="value">${value}</div><div class="sub ${cls}">${sub}</div></div>`}
function render(){
  $('#desktopNav').innerHTML=navHTML();$('#mobileNav').innerHTML=navHTML();bindNav();
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(`#page-${state.currentPage}`).classList.add('active');
  renderDashboard();renderTransactions();renderAccounts();renderBudget();renderGoals();renderBills();renderNetworth();renderSettings();
  applyTheme();
}
function renderDashboard(){const t=totals(),inc=monthlyIncome(),sp=monthlySpend(),cash=state.accounts.filter(a=>['Checking','Savings','Cash'].includes(a.type)).reduce((s,a)=>s+a.balance,0),budget=state.budgets.reduce((s,b)=>s+b.limit,0),up=upcomingBills().slice(0,4);const recent=[...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
 $('#page-dashboard').innerHTML=topbar(`Good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'} 👋`,`${periodLabel()} · Your money at a glance.`, `<button class="btn" onclick="go('settings')">⚙️</button><button class="btn primary" onclick="openTxModal()">+ Transaction</button>`,true)+
 `<div class="cards">${stat('NET WORTH',fmt(t.net),'+${0}% from account balances','up')}${stat('CASH',fmt(cash),`${state.accounts.filter(a=>['Checking','Savings','Cash'].includes(a.type)).length} cash accounts`)}${stat('SPENT THIS MONTH',fmt(sp),`of ${fmt(budget)} budget`,sp<=budget?'up':'down')}${stat('UPCOMING BILLS',fmt(upcomingBills().reduce((s,b)=>s+b.amount,0)),`${upcomingBills().length} bills remaining · ${periodLabel()}`)}</div>
 <div class="grid-2"><div class="card"><h2 class="section-title">Recent transactions</h2>${recent.length?recent.map(txRow).join(''):`<div class="empty">No transactions yet.</div>`}</div><div class="card"><h2 class="section-title">Budget progress</h2>${state.budgets.slice(0,5).map(b=>budgetRow(b)).join('')}</div></div>
 <div class="grid-3"><div class="card"><h2 class="section-title">Cash flow</h2><div class="chart-wrap"><canvas id="cashFlowChart"></canvas></div><div class="chart-legend"><span><i class="legend-dot"></i>Income</span><span><i class="legend-dot" style="background:var(--red)"></i>Spending</span></div></div><div class="card"><h2 class="section-title">Upcoming bills</h2>${up.length?up.map(billRow).join(''):`<div class="empty">No upcoming bills.</div>`}</div><div class="card"><h2 class="section-title">Goals</h2>${state.goals.slice(0,3).map(goalMini).join('')}</div></div>`;
 drawCashFlow();
}
function txRow(t){return `<div class="row"><div class="left"><div class="icon-box">${categoryIcon(t.category)}</div><div><div class="merchant">${esc(t.merchant)}</div><div class="subtext">${esc(t.category)} · ${dateLabel(t.date)}</div></div></div><div class="amount ${t.amount>0?'income':'expense'}">${fmtSigned(t.amount)}</div></div>`}
function budgetRow(b){const spent=spendByCategory(b.category),limit=b.amount||b.limit||0,pct=Math.min(100,Math.round(spent/(limit||1)*100));return `<div class="budget-item"><div class="budget-top"><div><div class="budget-name">${categoryIcon(b.category)} ${esc(b.name||b.category)}</div><div class="budget-meta">${fmt(spent)} spent · ${fmt(Math.max(0,limit-spent))} left</div></div><b>${fmt(limit)}</b></div><div class="progress ${pct>=100?'danger':''}"><span style="width:${pct}%"></span></div></div>`}
function billRow(b){return `<div class="row"><div class="left"><div class="icon-box">${categoryIcon(b.category)}</div><div><div class="merchant">${esc(b.name)}</div><div class="subtext">Due ${b.dueDay}${ordinal(b.dueDay)} · ${esc(accountName(b.accountId))}</div></div></div><div class="amount">${fmt(b.amount)}</div></div>`}
function goalMini(g){const pct=Math.min(100,Math.round(g.saved/g.target*100));return `<div class="budget-item"><div class="budget-top"><div><div class="budget-name">${g.emoji} ${esc(g.name)}</div><div class="budget-meta">${fmt(g.saved)} of ${fmt(g.target)}</div></div><b>${pct}%</b></div><div class="progress safe"><span style="width:${pct}%"></span></div></div>`}
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return s[(v-20)%10]||s[v]||s[0]}

 $('#page-transactions').innerHTML=topbar('Transactions',`${periodLabel()} · See exactly where every dollar is going.`,`<button class="btn" onclick="exportCSV()">Export CSV</button><button class="btn primary" onclick="openTxModal()">+ Transaction</button>`,true)+

}
function monthOptions(selected){const arr=[];const d=new Date();for(let i=0;i<12;i++){const x=new Date(d.getFullYear(),d.getMonth()-i,1);const k=monthKey(x);arr.push(`<option value="${k}" ${k===selected?'selected':''}>${monthLabel(k)}</option>`)}return arr.join('')}
function txTableRow(t){return `<tr><td><b>${esc(t.merchant)}</b>${t.note?`<div class="subtext">${esc(t.note)}</div>`:''}</td><td>${categoryIcon(t.category)} ${esc(t.category)}</td><td>${esc(accountName(t.accountId))}</td><td>${dateLabel(t.date)}</td><td class="right amount ${t.amount>0?'income':'expense'}">${fmtSigned(t.amount)}</td><td><div class="actions-cell"><button class="icon-btn" title="Edit" onclick="openTxModal(${t.id})">✏️</button><button class="icon-btn" title="Delete" onclick="deleteTx(${t.id})">🗑️</button></div></td></tr>`}

function renderAccounts(){const t=totals();$('#page-accounts').innerHTML=topbar('Accounts',`Track balances across your financial world.`,`<button class="btn primary" onclick="openAccountModal()">+ Account</button>`)+
 `<div class="cards">${stat('TOTAL ASSETS',fmt(t.assets),`${state.accounts.filter(isAsset).length} asset accounts`,'up')}${stat('LIABILITIES',fmt(t.liabilities),`${state.accounts.filter(a=>!isAsset(a)).length} liability accounts`,t.liabilities?'down':'')}${stat('NET WORTH',fmt(t.net),`Assets minus liabilities`)}${stat('ACCOUNTS',state.accounts.length,'All manually tracked')}</div>`+
 `<div class="grid-3">${state.accounts.map(accountCard).join('') || `<div class="card"><div class="empty">No accounts yet.</div></div>`}</div>`}
function accountCard(a){const cls=a.balance<0?'down':'up';return `<div class="card account-card"><div class="account-head"><div><div class="account-name">${esc(a.name)}</div><div class="small muted">${esc(a.institution||'Manual')} ${a.last4?'••'+esc(a.last4):''}</div></div><span class="badge">${esc(a.type)}</span></div><div class="account-balance ${cls}">${fmt(a.balance)}</div><div class="actions-cell"><button class="icon-btn" onclick="openAccountModal(${a.id})">✏️</button><button class="icon-btn" onclick="deleteAccount(${a.id})">🗑️</button></div></div>`}

function renderBudget(){const spent=monthlySpend(),limit=state.budgets.reduce((s,b)=>s+(b.amount||b.limit||0),0);$('#page-budget').innerHTML=topbar('Budget',`${periodLabel()} · Plan by category and pay period.`,`<button class="btn" onclick="openBudgetModal()">+ Budget</button>`,true)+
 `<div class="cards">${stat('BUDGET',fmt(limit),`${state.periodMode==='week'?'Weekly':state.periodMode==='biweek'?'Bi-weekly':'Monthly'} planned spend`)}${stat('SPENT',fmt(spent),`${Math.round((spent/(limit||1))*100)}% of budget`,spent<=limit?'up':'down')}${stat('REMAINING',fmt(Math.max(0,limit-spent)),'Available to spend',limit-spent>=0?'up':'down')}${stat('INCOME',fmt(monthlyIncome()),`Income in ${state.periodMode==='week'?'this week':state.periodMode==='biweek'?'this two-week period':'this month'}`,'up')}</div>`+

function budgetFullRow(b){const spent=spendByCategory(b.category),limit=b.amount||b.limit||0,pct=Math.round(spent/(limit||1)*100);return `<div class="row"><div style="flex:1"><div class="budget-top"><div><div class="budget-name">${categoryIcon(b.category)} ${esc(b.name||b.category)}</div><div class="budget-meta">${esc(b.category)} · ${esc(b.period||state.periodMode)} · ${fmt(spent)} spent · ${fmt(Math.max(0,limit-spent))} left</div></div><div style="display:flex;gap:6px;align-items:center"><b>${fmt(limit)}</b><button class="icon-btn" onclick="openBudgetModal(${b.id})">✏️</button><button class="icon-btn" onclick="deleteBudget(${b.id})">🗑️</button></div></div><div class="progress ${pct>=100?'danger':''}"><span style="width:${Math.min(100,pct)}%"></span></div></div></div>`}

function renderGoals(){$('#page-goals').innerHTML=topbar('Goals',`${periodLabel()} · Give your money somewhere to go.`,`<button class="btn primary" onclick="openGoalModal()">+ Goal</button>`,true)+`<div class="grid-3">${state.goals.map(g=>goalCard(g)).join('')||`<div class="card"><div class="empty">No savings goals yet.</div></div>`}</div>`}
function goalCard(g){const pct=Math.min(100,Math.round(g.saved/g.target*100));return `<div class="card"><div class="account-head"><div><div class="label">${g.emoji} ${esc(g.name).toUpperCase()}</div><div class="big">${fmt(g.saved)}</div><div class="small">of ${fmt(g.target)}${g.targetDate?' · '+new Date(g.targetDate+'T12:00:00').toLocaleDateString(undefined,{month:'short',year:'numeric'}):''}</div></div><div class="actions-cell"><button class="icon-btn" onclick="openGoalModal(${g.id})">✏️</button><button class="icon-btn" onclick="deleteGoal(${g.id})">🗑️</button></div></div><div class="progress safe"><span style="width:${pct}%"></span></div><div class="row" style="border:0;padding-bottom:0"><span class="small muted">${pct}% complete</span><span class="small ${pct>=100?'up':'muted'}">${pct>=100?'Goal reached 🎉':fmt(Math.max(0,g.target-g.saved))+' to go'}</span></div></div>`}

function renderBills(){const sorted=[...state.bills].sort((a,b)=>a.dueDay-b.dueDay);const total=state.bills.reduce((s,b)=>s+b.amount,0);$('#page-bills').innerHTML=topbar('Bills & subscriptions',`Know what is leaving your account.`,`<button class="btn primary" onclick="openBillModal()">+ Bill</button>`)+
 `<div class="cards">${stat('MONTHLY TOTAL',fmt(total),'Recurring obligations')}${stat('BILLS',state.bills.length,'Tracked recurring items')}${stat('NEXT 14 DAYS',fmt(upcomingBills().reduce((s,b)=>s+b.amount,0)),'Upcoming')}${stat('AVERAGE BILL',fmt(total/(state.bills.length||1)),'Per recurring item')}</div>`+
 `<div class="card" style="margin-top:16px"><div class="table-wrap"><table class="table"><thead><tr><th>Bill</th><th>Category</th><th>Due</th><th>Account</th><th class="right">Amount</th><th class="right"></th></tr></thead><tbody>${sorted.length?sorted.map(b=>`<tr><td><b>${esc(b.name)}</b></td><td>${categoryIcon(b.category)} ${esc(b.category)}</td><td>${b.dueDay}${ordinal(b.dueDay)}</td><td>${esc(accountName(b.accountId))}</td><td class="right"><b>${fmt(b.amount)}</b></td><td><div class="actions-cell"><button class="icon-btn" onclick="openBillModal(${b.id})">✏️</button><button class="icon-btn" onclick="deleteBill(${b.id})">🗑️</button></div></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">No recurring bills yet.</div></td></tr>`}</tbody></table></div></div>`}

function renderNetworth(){const t=totals();$('#page-networth').innerHTML=topbar('Net Worth',`A simple view of the bigger picture.`,`<button class="btn" onclick="go('accounts')">Manage accounts</button>`)+
 `<div class="cards">${stat('NET WORTH',fmt(t.net),`Assets ${fmt(t.assets)} · Liabilities ${fmt(t.liabilities)}`)}${stat('ASSETS',fmt(t.assets),`${state.accounts.filter(isAsset).length} accounts`,'up')}${stat('LIABILITIES',fmt(t.liabilities),`${state.accounts.filter(a=>!isAsset(a)).length} accounts`,t.liabilities?'down':'')}${stat('GOAL SAVINGS',fmt(state.goals.reduce((s,g)=>s+g.saved,0)),`${state.goals.length} active goals`,'up')}</div>
 <div class="grid-2"><div class="card"><h2 class="section-title">Account breakdown</h2>${state.accounts.map(a=>`<div class="row"><div class="left"><div class="icon-box">${a.type==='Investment'?'📈':a.type==='Credit Card'?'💳':'🏦'}</div><div><div class="merchant">${esc(a.name)}</div><div class="subtext">${esc(a.type)} · ${esc(a.institution||'Manual')}</div></div></div><div class="amount ${a.balance>=0?'income':'expense'}">${fmt(a.balance)}</div></div>`).join('')}</div><div class="card"><h2 class="section-title">6-month trend</h2><div class="chart-wrap"><canvas id="nwChart"></canvas></div><div class="chart-legend"><span>Illustrative history based on tracked balance</span></div></div></div>`;drawNetworth();}
function renderSettings(){$('#page-settings').innerHTML=topbar('Settings',`Make FinPilot work the way you want.`,`<button class="btn" onclick="backupJSON()">Backup JSON</button><button class="btn primary" onclick="$('#importFile').click()">Import</button>`)+
 `<div class="settings-grid"><div class="card"><h2 class="section-title">Preferences</h2><div class="row"><div><b>Dark mode</b><div class="subtext">Switch the app theme</div></div><label class="switch"><input id="themeToggle" type="checkbox" ${state.theme==='dark'?'checked':''}><span class="slider"></span></label></div><div class="row"><div><b>Currency</b><div class="subtext">Used across the dashboard</div></div><select id="currency" class="field" style="width:120px"><option value="USD" selected>USD ($)</option><option value="EUR">EUR (€)</option><option value="GBP">GBP (£)</option></select></div></div>
 <div class="card"><h2 class="section-title">Data</h2><div class="kpi-line"><span>Accounts</span><b>${state.accounts.length}</b></div><div class="kpi-line"><span>Transactions</span><b>${state.transactions.length}</b></div><div class="kpi-line"><span>Budget categories</span><b>${state.budgets.length}</b></div><div class="kpi-line"><span>Goals</span><b>${state.goals.length}</b></div><div class="kpi-line"><span>Recurring bills</span><b>${state.bills.length}</b></div><div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="$('#importFile').click()">Import backup</button><button class="btn" onclick="backupJSON()">Export backup</button><button class="btn danger" onclick="resetData()">Reset all data</button></div></div></div>
 <div class="card" style="margin-top:16px"><h2 class="section-title">About FinPilot</h2><p class="muted small">Budget items can have their own name, category, amount, and weekly, bi-weekly, or monthly period. The period control on Transactions, Budget, and Goals lets you switch between Week, Bi-week, and Month.</p><p class="muted small">This version is a local-first personal finance app. Accounts, transactions, budgets, goals and bills are stored in your browser on this device. No bank login is required.</p><p class="muted small">For security, do not enter bank passwords or sensitive credentials into FinPilot.</p></div>`;$('#themeToggle').onchange=e=>{state.theme=e.target.checked?'dark':'light';save();};$('#currency').value=state.currency;$('#currency').onchange=e=>{state.currency=e.target.value;save();render();}}

function drawCashFlow(){const c=$('#cashFlowChart');if(!c)return;fitCanvas(c);const ctx=c.getContext('2d');const rect=c.getBoundingClientRect();const w=rect.width,h=rect.height;ctx.clearRect(0,0,w,h);const r=periodRange(),days=Math.max(1,Math.round((r.end-r.start)/86400000)+1),income=Array(days).fill(0),spend=Array(days).fill(0);state.transactions.filter(t=>inPeriod(t.date)).forEach(t=>{const d=Math.round((new Date(t.date+'T12:00:00')-r.start)/86400000);if(d>=0&&d<days)(t.amount>0?income:spend)[d]+=Math.abs(t.amount)});const max=Math.max(100,...income,...spend);chartBars(ctx,w,h,[income,spend],max);}
function drawNetworth(){const c=$('#nwChart');if(!c)return;fitCanvas(c);const ctx=c.getContext('2d');const rect=c.getBoundingClientRect();const w=rect.width,h=rect.height;ctx.clearRect(0,0,w,h);const current=totals().net;const pts=[current*.78,current*.83,current*.88,current*.91,current*.96,current];lineChart(ctx,w,h,pts);}
function fitCanvas(c){const dpr=window.devicePixelRatio||1,r=c.getBoundingClientRect();c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);c.getContext('2d').scale(dpr,dpr)}
function chartBars(ctx,w,h,sets,max){const pad=24,base=h-24,group=w-40;const step=group/sets[0].length;ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--line');ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad,base);ctx.lineTo(w-pad,base);ctx.stroke();sets.forEach((arr,si)=>{arr.forEach((v,i)=>{if(!v)return;const bh=(v/max)*(h-50),x=pad+i*step+(si?step*.52:step*.10),bw=step*.32;ctx.fillStyle=si===0?'#635bff':'#d94b5c';ctx.beginPath();ctx.roundRect(x,base-bh,bw,bh,5);ctx.fill()})});}
function lineChart(ctx,w,h,pts){const pad=25,max=Math.max(...pts),min=Math.min(...pts),range=max-min||1;ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--line');ctx.beginPath();for(let i=0;i<4;i++){const y=pad+i*(h-2*pad)/3;ctx.moveTo(pad,y);ctx.lineTo(w-pad,y)}ctx.stroke();ctx.strokeStyle='#635bff';ctx.lineWidth=3;ctx.beginPath();pts.forEach((p,i)=>{const x=pad+i*(w-2*pad)/(pts.length-1),y=pad+(max-p)/range*(h-2*pad);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();pts.forEach((p,i)=>{const x=pad+i*(w-2*pad)/(pts.length-1),y=pad+(max-p)/range*(h-2*pad);ctx.fillStyle='#635bff';ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill()})}

function openTxModal(id){const editing=state.transactions.find(t=>t.id===id);const t=editing||{merchant:'',amount:'',category:'Food',date:new Date().toISOString().slice(0,10),accountId:state.accounts[0]?.id||'',note:''};showModal(`<div class="modal-head"><h2>${editing?'Edit':'Add'} transaction</h2><button class="btn icon" onclick="closeModal()">✕</button></div><form id="txForm"><div class="form-grid"><div class="form-group"><label>Merchant</label><input id="fMerchant" required value="${esc(t.merchant)}" placeholder="Walmart"></div><div class="form-group"><label>Amount</label><input id="fAmount" required type="number" step="0.01" value="${t.amount}" placeholder="-25.00"></div><div class="form-group"><label>Category</label><select id="fCategory">${categoryOptions(t.category)}</select></div><div class="form-group"><label>Account</label><select id="fAccount">${state.accounts.map(a=>`<option value="${a.id}" ${a.id===Number(t.accountId)?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div class="form-group"><label>Date</label><input id="fDate" type="date" value="${t.date}"></div><div class="form-group"><label>Note</label><input id="fNote" value="${esc(t.note||'')}" placeholder="Optional"></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="submit" class="btn primary">Save</button></div></form>`);$('#txForm').onsubmit=e=>{e.preventDefault();const payload={merchant:$('#fMerchant').value.trim(),category:$('#fCategory').value,date:$('#fDate').value,amount:Number($('#fAmount').value),accountId:Number($('#fAccount').value),note:$('#fNote').value.trim()}; if(!payload.merchant||!Number.isFinite(payload.amount))return;if(editing)Object.assign(editing,payload);else state.transactions.push({id:Date.now(),...payload});save();closeModal();toast(editing?'Transaction updated':'Transaction added');render()}}
function categoryOptions(sel){const cats=['Housing','Food','Transportation','Shopping','Fun','Entertainment','Travel','Income','Utilities','Health','Other'];return cats.map(c=>`<option ${c===sel?'selected':''}>${c}</option>`).join('')}
function openAccountModal(id){const editing=state.accounts.find(a=>a.id===id);const a=editing||{name:'',type:'Checking',institution:'',last4:'',balance:0};showModal(`<div class="modal-head"><h2>${editing?'Edit':'Add'} account</h2><button class="btn icon" onclick="closeModal()">✕</button></div><form id="accountForm"><div class="form-grid"><div class="form-group"><label>Name</label><input id="aName" required value="${esc(a.name)}" placeholder="Primary Checking"></div><div class="form-group"><label>Type</label><select id="aType">${['Checking','Savings','Cash','Credit Card','Investment','Loan'].map(x=>`<option ${x===a.type?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label>Institution</label><input id="aInst" value="${esc(a.institution||'')}" placeholder="Chase"></div><div class="form-group"><label>Last 4</label><input id="aLast4" maxlength="4" value="${esc(a.last4||'')}" placeholder="4821"></div><div class="form-group full"><label>Current balance</label><input id="aBal" required type="number" step="0.01" value="${a.balance}"></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`);$('#accountForm').onsubmit=e=>{e.preventDefault();const payload={name:$('#aName').value.trim(),type:$('#aType').value,institution:$('#aInst').value.trim(),last4:$('#aLast4').value.trim(),balance:Number($('#aBal').value)};if(editing)Object.assign(editing,payload);else state.accounts.push({id:Date.now(),...payload});save();closeModal();toast(editing?'Account updated':'Account added');render()}}
function openBudgetModal(id){const editing=state.budgets.find(b=>b.id===id);const b=editing||{name:'',category:'Food',amount:500,period:state.periodMode};showModal(`<div class="modal-head"><h2>${editing?'Edit':'Add'} budget</h2><button class="btn icon" onclick="closeModal()">✕</button></div><form id="budgetForm"><div class="form-grid"><div class="form-group"><label>Budget name</label><input id="bName" required value="${esc(b.name||'')}" placeholder="Groceries"></div><div class="form-group"><label>Category</label><select id="bCat">${categoryOptions(b.category)}</select></div><div class="form-group"><label>Amount</label><input id="bAmount" type="number" step="0.01" min="0" required value="${b.amount??b.limit??500}"></div><div class="form-group"><label>Budget period</label><select id="bPeriod"><option value="week" ${b.period==='week'?'selected':''}>Weekly</option><option value="biweek" ${b.period==='biweek'?'selected':''}>Bi-weekly</option><option value="month" ${b.period==='month'?'selected':''}>Monthly</option></select></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`);$('#budgetForm').onsubmit=e=>{e.preventDefault();const payload={name:$('#bName').value.trim(),category:$('#bCat').value,amount:Number($('#bAmount').value),period:$('#bPeriod').value};if(editing)Object.assign(editing,payload);else state.budgets.push({id:Date.now(),...payload});save();closeModal();toast(editing?'Budget updated':'Budget added');render()}}
function openGoalModal(id){const editing=state.goals.find(g=>g.id===id);const g=editing||{name:'',emoji:'🎯',target:1000,saved:0,targetDate:''};showModal(`<div class="modal-head"><h2>${editing?'Edit':'Add'} goal</h2><button class="btn icon" onclick="closeModal()">✕</button></div><form id="goalForm"><div class="form-grid"><div class="form-group"><label>Name</label><input id="gName" required value="${esc(g.name)}" placeholder="Emergency fund"></div><div class="form-group"><label>Emoji</label><input id="gEmoji" value="${esc(g.emoji)}" maxlength="2"></div><div class="form-group"><label>Target amount</label><input id="gTarget" type="number" step="0.01" required value="${g.target}"></div><div class="form-group"><label>Saved so far</label><input id="gSaved" type="number" step="0.01" required value="${g.saved}"></div><div class="form-group full"><label>Target date</label><input id="gDate" type="date" value="${g.targetDate||''}"></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`);$('#goalForm').onsubmit=e=>{e.preventDefault();const payload={name:$('#gName').value.trim(),emoji:$('#gEmoji').value||'🎯',target:Number($('#gTarget').value),saved:Number($('#gSaved').value),targetDate:$('#gDate').value};if(editing)Object.assign(editing,payload);else state.goals.push({id:Date.now(),...payload});save();closeModal();toast(editing?'Goal updated':'Goal added');render()}}
function openBillModal(id){const editing=state.bills.find(b=>b.id===id);const b=editing||{name:'',amount:0,dueDay:1,category:'Utilities',accountId:state.accounts[0]?.id||''};showModal(`<div class="modal-head"><h2>${editing?'Edit':'Add'} recurring bill</h2><button class="btn icon" onclick="closeModal()">✕</button></div><form id="billForm"><div class="form-grid"><div class="form-group"><label>Name</label><input id="rName" required value="${esc(b.name)}" placeholder="Internet"></div><div class="form-group"><label>Amount</label><input id="rAmount" type="number" step="0.01" required value="${b.amount}"></div><div class="form-group"><label>Due day</label><input id="rDay" type="number" min="1" max="31" required value="${b.dueDay}"></div><div class="form-group"><label>Category</label><select id="rCat">${categoryOptions(b.category)}</select></div><div class="form-group full"><label>Account</label><select id="rAccount">${state.accounts.map(a=>`<option value="${a.id}" ${a.id===Number(b.accountId)?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`);$('#billForm').onsubmit=e=>{e.preventDefault();const payload={name:$('#rName').value.trim(),amount:Number($('#rAmount').value),dueDay:Math.max(1,Math.min(31,Number($('#rDay').value))),category:$('#rCat').value,accountId:Number($('#rAccount').value),recurring:true};if(editing)Object.assign(editing,payload);else state.bills.push({id:Date.now(),...payload});save();closeModal();toast(editing?'Bill updated':'Bill added');render()}}
function showModal(html){$('#modal').innerHTML=html;$('#modalBackdrop').classList.add('show')}
function closeModal(){$('#modalBackdrop').classList.remove('show');$('#modal').innerHTML=''}
$('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function deleteTx(id){const t=state.transactions.find(x=>x.id===id);if(!t||!confirm(`Delete ${t.merchant}?`))return;state.transactions=state.transactions.filter(x=>x.id!==id);save();toast('Transaction deleted');render()}
function deleteAccount(id){if(!confirm('Delete this account? Existing transactions will remain and show as Account.'))return;state.accounts=state.accounts.filter(a=>a.id!==id);state.transactions.forEach(t=>{if(t.accountId===id)t.accountId=null});save();toast('Account deleted');render()}
function deleteBudget(id){if(confirm('Delete this budget category?')){state.budgets=state.budgets.filter(b=>b.id!==id);save();toast('Budget category deleted');render()}}
function deleteGoal(id){if(confirm('Delete this goal?')){state.goals=state.goals.filter(g=>g.id!==id);save();toast('Goal deleted');render()}}
function deleteBill(id){if(confirm('Delete this bill?')){state.bills=state.bills.filter(b=>b.id!==id);save();toast('Bill deleted');render()}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800)}
function exportCSV(){const rows=[['Date','Merchant','Category','Account','Amount','Note'],...state.transactions.map(t=>[t.date,t.merchant,t.category,accountName(t.accountId),t.amount,t.note||''])];downloadText('finpilot-transactions.csv',rows.map(r=>r.map(csvEscape).join(',')).join('\n'),'text/csv');toast('CSV exported')}
function csvEscape(v){const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function backupJSON(){downloadText('finpilot-backup.json',JSON.stringify(state,null,2),'application/json');toast('Backup downloaded')}
function downloadText(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
$('#importFile').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const raw=String(reader.result||'');if(/\.csv$/i.test(file.name)){const lines=raw.split(/\r?\n/).filter(Boolean);const rows=lines.slice(1).map(parseCSVLine);if(!rows.length)throw new Error('Empty CSV');rows.forEach(r=>{const [date,merchant,category,account,amount,note]=r;const acct=state.accounts.find(a=>(a.name||'').toLowerCase()===(account||'').toLowerCase())||state.accounts[0];state.transactions.push({id:Date.now()+Math.random(),date:date||new Date().toISOString().slice(0,10),merchant:merchant||'Imported',category:category||'Other',accountId:acct?.id||null,amount:Number(String(amount||0).replace(/[$,]/g,''))||0,note:note||''})});save();toast(`${rows.length} transactions imported`);render();return}const parsed=JSON.parse(raw);if(!parsed.accounts||!parsed.transactions)throw new Error('Invalid backup');state={...clone(DEFAULT_STATE),...parsed,currentPage:state.currentPage};save();toast('Backup imported');render()}catch(err){alert('Could not import that file. Use a FinPilot JSON backup or a CSV exported from FinPilot.')}e.target.value=''};reader.readAsText(file)})
function parseCSVLine(line){const out=[];let cur='',quoted=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(quoted&&line[i+1]==='"'){cur+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out}
function resetData(){if(!confirm('Reset FinPilot to a completely blank account? This will permanently remove all accounts, transactions, budgets, goals, and bills stored on this device.'))return;state=clone(DEFAULT_STATE);save();toast('FinPilot reset to blank');render()}
window.addEventListener('resize',()=>{if(state.currentPage==='dashboard')drawCashFlow();if(state.currentPage==='networth')drawNetworth()});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
render();
</script>
</body>
</html>
